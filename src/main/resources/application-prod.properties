# ========================
# PROD Profile
# All sensitive values MUST come from environment variables.
# No defaults with real credentials are set here.
# ========================

# -- Strict SQL logging off in prod --
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# -- Minimal logging in prod --
logging.level.root=WARN
logging.level.com.lmg.online.chatbot=INFO

# -- Disable Swagger in prod (re-enable behind VPN if needed) --
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# -- Strict rate limiting --
app.business.rate-limit.requests-per-minute=60

# -- Longer cache TTL in prod --
app.business.cache.ttl-hours=2
app.business.cache.max-size=2000

# -- TLS for cloud Qdrant --
spring.ai.vectorstore.qdrant.use-tls=true

# -- Stricter JPA DDL in prod (validate, not update) --
spring.jpa.hibernate.ddl-auto=validate
