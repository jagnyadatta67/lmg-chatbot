<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LIFESTYLE — Widget Test</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5}
    .demo-nav{background:#F89F17;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
    .demo-nav-brand{color:white;font-size:20px;font-weight:800;letter-spacing:2px}
    #account-actions-signup{
      background:white;color:#F89F17;border:none;
      padding:8px 20px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer;
    }
    #account-actions-signup:hover{opacity:0.85}
    .demo-body{padding:40px 24px;color:#333}
    .login-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:99999;align-items:center;justify-content:center}
    .login-overlay.open{display:flex}
    .login-modal{background:white;border-radius:16px;padding:32px;width:min(90vw,380px);box-shadow:0 20px 60px rgba(0,0,0,0.25);position:relative}
    .login-modal h3{font-size:20px;font-weight:700;margin-bottom:4px}
    .login-modal p{font-size:13px;color:#888;margin-bottom:20px}
    .login-input{width:100%;border:1.5px solid #e5e7eb;border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:12px;outline:none}
    .login-input:focus{border-color:#F89F17}
    .login-btn{width:100%;background:#F89F17;color:white;border:none;padding:13px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
    .login-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:#888}
  </style>
</head>
<body>
  <nav class="demo-nav">
    <div class="demo-nav-brand">LIFESTYLE</div>
    <button id="account-actions-signup">Sign In / Register</button>
  </nav>
  <div class="demo-body">
    <h2>Lifestyle — Chatbot Widget Test</h2>
    <p style="margin-top:8px;color:#666;font-size:13px">Click chat → Login / Sign Up → widget collapses → login modal opens.</p>
  </div>
  <div class="login-overlay" id="demo-login-overlay">
    <div class="login-modal">
      <button class="login-close" onclick="document.getElementById('demo-login-overlay').classList.remove('open')">✕</button>
      <h3>Sign In</h3>
      <p>Demo login modal — triggered by chatbot widget</p>
      <input class="login-input" type="email" placeholder="Email address" />
      <input class="login-input" type="password" placeholder="Password" />
      <button class="login-btn">Continue</button>
    </div>
  </div>
  <script>
    document.getElementById("account-actions-signup").addEventListener("click", function() {
      document.getElementById("demo-login-overlay").classList.add("open")
    })
  </script>
  <script src="http://localhost:8080/widget/chatbot-widget-res.js?v=92111"
          data-backend="http://localhost:8080/api/chat"
          data-appid="Desktop"
          data-userid="tBgd8PKlHa8u7He/UkVfRdX71O1ym6w8Xu1J8gJIsvFMNwYLL2jjEA=="
          data-concept="LIFESTYLE"
          data-env="uat1"
          X-API-Key="lmg-0b9e204b67246750c9ccd5d285ebceffc60a2b5b8052af77b33600fce121c5c4">
  </script>
</body>
</html>
