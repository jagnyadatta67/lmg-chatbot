# ========================
# DEV Profile
# Overrides application.properties for local development.
# DB / Redis / API credentials come from .env — do NOT hardcode here.
# ========================

# -- Qdrant / Chroma: local instances --
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.chroma.client.host=localhost

# -- Show SQL in dev for debugging --
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -- Verbose logging in dev --
logging.level.root=INFO
logging.level.com.lmg.online.chatbot=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# -- Swagger always ON in dev --
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# -- Relaxed rate limit locally --
app.business.rate-limit.requests-per-minute=300

# -- All features on in dev --
app.business.features.analytics-enabled=true
app.business.features.cache-enabled=true
app.business.features.vector-search-enabled=true
